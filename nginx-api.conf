server {
    listen 80;
    server_name api.teesik.store;

    location / {
        # Allow OPTIONS requests for CORS preflight
        if ($request_method = "OPTIONS") {
            add_header "Access-Control-Allow-Origin" "$http_origin" always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header "Access-Control-Allow-Headers" "Authorization, Content-Type, X-Cart-ID, X-Origin-Verify" always;
            add_header "Access-Control-Allow-Credentials" "true" always;
            return 204;
        }

        # Check for security header on other requests
        if ($http_x_origin_verify != "teesik") {
            return 403;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
