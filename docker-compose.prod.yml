# ══════════════════════════════════════════════════════════════════════════════
# Docker Compose — Production (EC2 All-in-One)
# ══════════════════════════════════════════════════════════════════════════════
# Usage: docker-compose -f docker-compose.prod.yml up -d
# ══════════════════════════════════════════════════════════════════════════════

services:
    app:
        image: teesik-backend:latest
        container_name: teesik-app
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            APP_URL: https://api.teesik.store
            LOG_CHANNEL: stderr
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-teesik}
            DB_USERNAME: ${DB_USERNAME:-teesik_admin}
            DB_PASSWORD: ${DB_PASSWORD}
            APP_KEY: ${APP_KEY}
            PANCAKE_API_KEY: ${PANCAKE_API_KEY}
            PANCAKE_SHOP_ID: ${PANCAKE_SHOP_ID}
            PANCAKE_WAREHOUSE_ID: ${PANCAKE_WAREHOUSE_ID:-}
            PANCAKE_BASE_URL: https://pos.pages.fm/api/v1
            GHN_API_TOKEN: ${GHN_API_TOKEN}
            GHN_SHOP_ID: ${GHN_SHOP_ID}
            MOMO_ENV: ${MOMO_ENV:-sandbox}
            MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE}
            MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY}
            MOMO_SECRET_KEY: ${MOMO_SECRET_KEY}
            MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
            MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-https://teesik.store/checkout}
            MOMO_IPN_URL: ${MOMO_IPN_URL:-https://api.teesik.store/api/v1/payment/momo/ipn}
            SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET}
            SEPAY_WEBHOOK_AUTH_METHOD: ${SEPAY_WEBHOOK_AUTH_METHOD:-hmac}
            QR_PAYMENT_CODE_PREFIX: ${QR_PAYMENT_CODE_PREFIX:-TEESIK}
            QR_BANK_BIN: ${QR_BANK_BIN}
            QR_BANK_ACCOUNT_NUMBER: ${QR_BANK_ACCOUNT_NUMBER}
            QR_BANK_ACCOUNT_NAME: ${QR_BANK_ACCOUNT_NAME}
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost/health-check.php || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 512M
                reservations:
                    memory: 256M

    db:
        image: mysql:8.0
        container_name: teesik-db
        restart: unless-stopped
        # Do NOT expose port to public — only accessible within Docker network
        # Uncomment for debugging:
        # ports:
        #     - "127.0.0.1:3306:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-teesik}
            MYSQL_USER: ${DB_USERNAME:-teesik_admin}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - /opt/teesik/mysql-data:/var/lib/mysql
        command: >
            --default-authentication-plugin=mysql_native_password
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_unicode_ci
            --innodb-buffer-pool-size=128M
            --innodb-log-file-size=64M
            --max-connections=50
            --key-buffer-size=16M
            --tmp-table-size=32M
            --max-heap-table-size=32M
            --slow-query-log=1
            --slow-query-log-file=/var/lib/mysql/slow.log
            --long-query-time=2
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 384M
                reservations:
                    memory: 256M
