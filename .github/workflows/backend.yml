name: Backend CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# ─── Global ───────────────────────────────────────────────────────────────────
env:
  PHP_VERSION: "8.2"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/teesik-backend
  WORKING_DIRECTORY: teesik-backend

concurrency:
  group: "backend-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
jobs:
# ──────────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test (PHPUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: teesik_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_mysql, gd, zip, exif, pcntl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKING_DIRECTORY }}/vendor
          key: composer-${{ hashFiles('teesik-backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-req=php+

      - name: Prepare Laravel environment
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: teesik_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run migrations
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: teesik_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run PHPUnit tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: php artisan test --parallel
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: teesik_test
          DB_USERNAME: root
          DB_PASSWORD: root

# ──────────────────────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    # Only build on push to main (not PRs)
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write  # needed to push to GHCR

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ──────────────────────────────────────────────────────────────────────────────
# DEPLOY TO AWS EC2
# ─────────────────
# Uncomment this job when your EC2 server is ready.
# The server must have Docker + docker-compose installed.
#
# Required GitHub Secrets:
#   SSH_HOST         — EC2 public IP or domain (e.g. 13.250.x.x)
#   SSH_USER         — SSH username (e.g. ubuntu or ec2-user)
#   SSH_PRIVATE_KEY  — contents of your .pem key file
#   SSH_PORT         — SSH port, usually 22
#   APP_KEY          — Laravel APP_KEY (base64:...)
#   DB_PASSWORD      — MySQL root password on the server
# ──────────────────────────────────────────────────────────────────────────────

  deploy:
    name: 🚀 Deploy → AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    environment:
      name: production
      url: http://${{ secrets.SSH_HOST }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/teesik-backend

            # Pull latest image from GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin
            
            # Create/Update docker-compose.yml if needed (optional)
            # For now assume it exists on the server
            
            docker compose pull app
            
            # Restart with zero downtime
            docker compose up -d --no-deps app

            # Run migrations
            docker compose exec -T app php artisan migrate --force

            # Clear caches
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache

            # Remove unused Docker images
            docker image prune -f
