# ══════════════════════════════════════════════════════════════════════════════
# Backend CI/CD — Laravel + Docker → AWS ECR + EC2 Deploy
# ══════════════════════════════════════════════════════════════════════════════
#
# Pipeline:  Test (PHPUnit) → Build & Push to ECR → Deploy to EC2 via SSH
#
# Trigger:   push to main, pull_request to main, manual dispatch
# ══════════════════════════════════════════════════════════════════════════════

name: Backend CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# ─── Global ───────────────────────────────────────────────────────────────────
env:
  PHP_VERSION: "8.2"

concurrency:
  group: "backend-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
jobs:
# ──────────────────────────────────────────────────────────────────────────────
# JOB 1: TEST
# ──────────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test (PHPUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: teesik_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_mysql, gd, zip, exif, pcntl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-req=php+

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: teesik_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: teesik_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run PHPUnit tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: teesik_test
          DB_USERNAME: root
          DB_PASSWORD: root

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2: BUILD & PUSH TO ECR
# ──────────────────────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push → ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    permissions:
      contents: read

    outputs:
      image_sha: ${{ steps.short-sha.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: short-sha
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:sha-${{ steps.short-sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_ENV=production

      - name: Verify ECR push
        run: |
          echo "✅ Pushed to ECR"
          echo "   Image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:sha-${{ steps.short-sha.outputs.sha }}"

# ──────────────────────────────────────────────────────────────────────────────
# JOB 3: DEPLOY TO EC2 VIA SSH
# ──────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy → EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment..."

            # Login to ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            # Pull new image
            IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:sha-${{ needs.build.outputs.image_sha }}"
            echo "📥 Pulling: $IMAGE"
            docker pull "$IMAGE"

            # Tag for docker-compose
            docker tag "$IMAGE" teesik-backend:latest

            # Deploy with docker-compose
            cd /opt/teesik
            docker-compose -f docker-compose.prod.yml up -d --no-deps app

            # Wait for health check
            echo "⏳ Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/health-check.php > /dev/null 2>&1; then
                echo "✅ App is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Health check failed!"
                docker-compose -f docker-compose.prod.yml logs --tail=30 app
                exit 1
              fi
              echo "   Attempt $i/30..."
              sleep 2
            done

            # Cleanup old images
            docker image prune -f
            echo "✅ Deployment complete!"

      - name: Verify deployment
        run: |
          echo "✅ Backend deployed to EC2"
          echo "   Host: ${{ secrets.EC2_HOST }}"
          echo "   Image: sha-${{ needs.build.outputs.image_sha }}"
